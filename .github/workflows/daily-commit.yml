name: Daily Auto Commit (dev-heart)

on:
  schedule:
    # 16:00 UTC = 23:00 WIB
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Random Consistent Commits
        run: |
          git config --global user.email "raffaeljkt@gmail.com"
          git config --global user.name "fidhera"
          
          # TARGET: 8 sampai 12 Commit acak
          COUNT=$((RANDOM % 5 + 8))
          
          echo "Target hari ini: $COUNT commits (Jadwal 23:00 WIB / 16:00 UTC)"
          
          for ((i=1; i<=COUNT; i++))
          do
            echo "dev-heart beat $i of $COUNT at $(date -u)" >> last_run_log.txt
            git add last_run_log.txt
            git commit -m "Auto commit batch $i of $COUNT: dev-heart pulse"
            
            # Jeda 2 detik agar timestamp rapi
            sleep 2
          done
          
          # Rebase sebelum push untuk mencegah error rejected jika ada push bersamaan
          git pull --rebase origin main
          git push origin main
